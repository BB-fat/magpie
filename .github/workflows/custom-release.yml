name: Custom release

# Pushing v* builds two assets for BB-fat/magpie Releases. Official
# self-update is disabled in this fork; see docs/custom-fork.md.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Tag to build (e.g. v0.1.1295-custom.1), must exist on custom'
        required: true
        type: string

permissions:
  contents: write

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.ver.outputs.ref }}
      version: ${{ steps.ver.outputs.version }}
      upstream: ${{ steps.ver.outputs.upstream }}
      custom_commits: ${{ steps.ver.outputs.custom_commits }}
      sha: ${{ steps.ver.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve tag and versions
        id: ver
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            REF="$GITHUB_REF_NAME"
          else
            REF="$INPUT_VERSION"
          fi
          [[ "$REF" =~ ^v[0-9][0-9A-Za-z.+-]*$ ]] || { echo "bad ref: $REF" >&2; exit 1; }
          VERSION="${REF#v}"
          git remote add upstream https://github.com/yetone/magpie.git 2>/dev/null || true
          git fetch upstream --tags --force 2>/dev/null || true
          # Plain upstream release tags only (v0.1.N), not fork tags like v0.1.1295-custom.1
          UPSTREAM_TAG=""
          while read -r tag; do
            [[ "$tag" =~ ^v0\.1\.[0-9]+$ ]] || continue
            if git merge-base --is-ancestor "$tag" HEAD 2>/dev/null; then
              UPSTREAM_TAG="$tag"
            fi
          done < <(git tag -l 'v0.1.*' | sort -V)
          [ -n "$UPSTREAM_TAG" ] || { echo "no upstream base tag found on this commit" >&2; exit 1; }
          UPSTREAM="${UPSTREAM_TAG#v}"
          CUSTOM=$(git rev-list --count "${UPSTREAM_TAG}..HEAD")
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "upstream=$UPSTREAM" >> "$GITHUB_OUTPUT"
          echo "custom_commits=$CUSTOM" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Upstream base ${UPSTREAM_TAG}, custom commits since: ${CUSTOM}"

  build-linux-amd64:
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build static CLI (linux/amd64)
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          mkdir -p dist
          LDFLAGS="-s -w -X main.version=${VERSION}"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -tags nogui -trimpath -ldflags="$LDFLAGS" -o dist/magpie-cli-linux-amd64 .
          file dist/magpie-cli-linux-amd64

      - uses: actions/upload-artifact@v4
        with:
          name: linux-amd64
          path: dist/magpie-cli-linux-amd64

  build-darwin-arm64:
    needs: meta
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Same deliverable as yetone/magpie-releases: magpie-darwin-arm64.zip
      # (magpie.app menu bar bundle, not the nogui CLI).
      - name: Build magpie.app and zip
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          make app
          mkdir -p dist
          ditto -c -k --keepParent magpie.app dist/magpie-darwin-arm64.zip
          ls -la dist/

      - uses: actions/upload-artifact@v4
        with:
          name: darwin-arm64
          path: dist/magpie-darwin-arm64.zip

  release:
    needs: [meta, build-linux-amd64, build-darwin-arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect release files
        run: |
          mkdir -p dist/checksums
          cp artifacts/linux-amd64/magpie-cli-linux-amd64 dist/
          cp artifacts/darwin-arm64/magpie-darwin-arm64.zip dist/
          (cd dist && sha256sum magpie-cli-linux-amd64 magpie-darwin-arm64.zip > checksums/sha256.txt)
          cat dist/checksums/sha256.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          REF: ${{ needs.meta.outputs.ref }}
          VERSION: ${{ needs.meta.outputs.version }}
          UPSTREAM: ${{ needs.meta.outputs.upstream }}
          CUSTOM_COMMITS: ${{ needs.meta.outputs.custom_commits }}
          SHA: ${{ needs.meta.outputs.sha }}
        run: |
          notes="## Custom fork release

          - **Upstream base:** v${UPSTREAM}
          - **Custom commits since upstream tag:** ${CUSTOM_COMMITS}
          - **Built from:** \`${SHA}\`

          ### Assets (2)

          | File | Platform |
          | --- | --- |
          | \`magpie-darwin-arm64.zip\` | macOS Apple Silicon — \`magpie.app\` menu bar bundle (same shape as [yetone/magpie-releases](https://github.com/yetone/magpie-releases)) |
          | \`magpie-cli-linux-amd64\` | Linux x86_64 — static \`nogui\` CLI (\`CGO_ENABLED=0\`), suitable for \`/usr/local/bin/magpie\` on Ubuntu 24.04 |

          ### SHA-256

          \`\`\`
          $(cat dist/checksums/sha256.txt)
          \`\`\`

          Built-in self-update to the official feed is **disabled** in this fork (\`forkbuild.CustomFork\`); install upgrades from this repo's Releases. See [docs/custom-fork.md](https://github.com/BB-fat/magpie/blob/custom/docs/custom-fork.md)."
          if gh release view "$REF" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$REF" --repo "$GITHUB_REPOSITORY" dist/magpie-cli-linux-amd64 dist/magpie-darwin-arm64.zip --clobber
            gh release edit "$REF" --repo "$GITHUB_REPOSITORY" --notes "$notes"
          else
            gh release create "$REF" --repo "$GITHUB_REPOSITORY" dist/magpie-cli-linux-amd64 dist/magpie-darwin-arm64.zip \
              --title "Custom ${VERSION}" \
              --notes "$notes"
          fi
